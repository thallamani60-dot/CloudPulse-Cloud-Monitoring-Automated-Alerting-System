name: Cloud Telemetry Monitoring

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub scheduled workflows run no more frequently than every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run endpoint checks
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python monitor.py

      - name: Persist uptime history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/uptime.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore: update uptime telemetry"
            git push
          fi
